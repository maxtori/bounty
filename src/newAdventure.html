<div>
  <h2 class="text-center">{{ update ? 'Edit' : 'New' }} Adventure</h2>
  <div class="card">
    <div class="card-body">
      <div class="my-2">
        <label class="form-label">Name</label>
        <input class="form-control" v-model="adv.name">
      </div>
      <div class="my-2">
        <label class="form-label">Currency</label>
        <input class="form-control" v-model="adv.currency">
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-header">Crew</div>
    <div class="card-body">
      <div v-for="s in adv.crew" class="input-group">
        <span class="input-group-text">Name</span>
        <input class="form-control" v-model="s.name" :ref="s.id+'-input'">
        <button class="btn btn-outline-secondary" @click="remove(s.id)"><i class="bi bi-trash3"></i></button>
      </div>
      <div class="text-center m-3">
        <button class="btn btn-outline-secondary" @click="add()"><i class="bi bi-plus"></i></button>
      </div>
    </div>
  </div>
</div>
