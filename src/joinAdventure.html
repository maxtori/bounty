<div>
  <div v-if="adv===undefined" class="text-center my-5 py-5">
    <div class="spinner-border"></div>
  </div>
  <div v-else>
    <div class="card">
      <div class="card-header text-center">Join the Adventure</div>
      <div class="card-body">{{ adv.name }}</div>
    </div>
    <div class="card">
      <div class="card-header text-center">Who are you?</div>
      <div class="card-body">
        <ul class="list-group">
          <li class="list-group-item p-0" :class="(chosen==s.id) ? 'active' : ''" v-for="s in adv.crew" @click="chosen=s.id">
            <input class="form-control" v-model="s.name" :disabled="s.peer!==null"/>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
