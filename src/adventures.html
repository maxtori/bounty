<div>
  <div v-for="a in adventures" class="card text-center">
    <div class="card-body" @click="adventure(a)" role="button">
      {{ a.name }}
    </div>
    <div class="card-footer text-center">
      <button class="btn btn-outline-secondary mx-2" @click="share(a.id)"><i class="bi bi-share"></i></button>
      <button class="btn btn-outline-secondary mx-2" @click="edit(a)"><i class="bi bi-pencil-square"></i></button>
      <button class="btn btn-outline-secondary mx-2" @click="remove(a.id)"><i class="bi bi-trash3"></i></button>
    </div>
  </div>
</div>
